name: spaDIVA
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=1.24,<2
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - scikit-misc
  - hnswlib=0.8.*
  - matplotlib>=3.7
  - scanpy>=1.10
  - anndata>=0.9
  - r-base=4.4.*
  - rpy2=3.6.*
  - r-mclust=6.1.*
  - ipykernel
  - jupyterlab
  - nbformat
  - nbclient
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - torch-geometric>=2.5,<2.7
